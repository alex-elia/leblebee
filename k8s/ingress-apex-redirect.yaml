apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leblebee-apex-redirect
  namespace: leblebee
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: https://www.leblebee.com$request_uri
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - leblebee.com
      secretName: leblebee-apex-tls
  rules:
    - host: leblebee.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: leblebee
                port:
                  name: http
