<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Leblebee</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f1ea;font-family:Georgia,'Times New Roman',serif;color:#1c1b19;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f1ea;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fffdf8;border:1px solid #d9d2c5;border-radius:8px;padding:28px 24px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:28px;letter-spacing:-0.02em;">Leblebee</p>
                <p style="margin:0 0 16px;font-size:16px;line-height:1.5;color:#5c574e;">
                  Enter this code on the sign-in page (recommended). It expires soon.
                </p>
                <p style="margin:0 0 24px;font-family:Arial,sans-serif;font-size:32px;font-weight:700;letter-spacing:0.2em;color:#3f4f2f;">
                  {{ .Token }}
                </p>
                <p style="margin:0 0 12px;font-size:14px;line-height:1.5;color:#5c574e;font-family:Arial,sans-serif;">
                  Or open this one-time link (works in any browser):
                </p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#3f4f2f;color:#fffdf8;text-decoration:none;font-family:Arial,sans-serif;font-size:15px;font-weight:600;padding:12px 18px;border-radius:6px;">
                    Sign in to Leblebee
                  </a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#7a7468;font-family:Arial,sans-serif;">
                  If you did not request this, you can ignore the email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
