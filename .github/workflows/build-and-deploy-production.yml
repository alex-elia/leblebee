name: Build and Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/leblebee
  NAMESPACE: leblebee
  DEPLOYMENT_NAME: leblebee
  CONTAINER_NAME: leblebee

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: production
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
      image_tag_latest: ${{ steps.image_tag.outputs.tag_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: image_tag
        shell: bash
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=production-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=production-latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}

  push-migrations:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          PROJECT_REF="${SUPABASE_PROJECT_ID:-bbvpuxuvtnpfmprufgab}"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are required for db push"
            exit 1
          fi
          echo "Pushing migrations to project: $PROJECT_REF"
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-push, push-migrations]
    environment: production
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy to production Kubernetes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT }}
          script: |
            set -euo pipefail

            REGISTRY="ghcr.io"
            IMAGE_NAME="${{ github.repository_owner }}/leblebee"
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            NEW_IMAGE="$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
            NAMESPACE="${{ env.NAMESPACE }}"

            echo "Deploying Leblebee to production"
            echo "Image: $NEW_IMAGE"

            kubectl get namespace "$NAMESPACE" >/dev/null \
              || (echo "Namespace $NAMESPACE missing. Apply kale-infra production/k8s/leblebee first." && exit 1)

            kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n "$NAMESPACE" >/dev/null \
              || (echo "Deployment missing. Apply kale-infra production/k8s/leblebee first." && exit 1)

            kubectl get secret leblebee-secrets -n "$NAMESPACE" >/dev/null \
              || (echo "Missing leblebee-secrets. Create on jump host (kale-infra README)." && exit 1)

            kubectl get secret ghcr-secret -n "$NAMESPACE" >/dev/null \
              || (echo "Missing ghcr-secret in $NAMESPACE." && exit 1)

            kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
              ${{ env.CONTAINER_NAME }}="$NEW_IMAGE" \
              -n "$NAMESPACE"

            kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
              -n "$NAMESPACE" --timeout=8m

            kubectl get pods -n "$NAMESPACE" -l app=leblebee -o wide
            echo "Deployment completed"

      - name: Public health check
        continue-on-error: true
        run: |
          sleep 8
          if curl -fsS --max-time 15 https://www.leblebee.com/api/health; then
            echo "Public health check passed"
          else
            echo "Public health check inconclusive (DNS/TLS may still be pending)"
          fi
